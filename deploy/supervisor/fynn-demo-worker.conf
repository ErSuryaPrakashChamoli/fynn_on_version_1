; Supervisor programs for the /demo environment's queue workers.
;
; /demo runs the same application against the DEMO database. Jobs pushed
; from /demo (imports, exports, OCR, queued notifications) land on the
; `demo` queue connection — the jobs table of the demo database — and are
; ONLY ever processed by `php artisan demo:queue-work`, which runs the
; whole worker inside the demo context. The main workers in
; fynn-ocr-worker.conf never see them, and a plain `queue:work demo`
; refuses them (see DemoPanelProvider::boot()).
;
; Install: sudo cp deploy/supervisor/fynn-demo-worker.conf /etc/supervisor/conf.d/
; Then:    sudo supervisorctl reread && sudo supervisorctl update
;
; Adjust `directory`, `user`, and the php binary path to match the server.
; One process per queue is plenty for a demo.

[program:fynn-demo-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/home/administrator/Documents/fynn_on_live/fynn_on_version_1
command=/usr/bin/php8.5 artisan demo:queue-work --queue=default --sleep=3 --tries=2 --max-time=21600
autostart=true
autorestart=true
startsecs=5
startretries=3
user=administrator
numprocs=1
stopwaitsecs=3660
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/home/administrator/Documents/fynn_on_live/fynn_on_version_1/storage/logs/demo-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:fynn-demo-quick-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/home/administrator/Documents/fynn_on_live/fynn_on_version_1
command=/usr/bin/php8.5 artisan demo:queue-work --queue=quick --sleep=3 --tries=2 --max-time=21600
autostart=true
autorestart=true
startsecs=5
startretries=3
user=administrator
numprocs=1
stopwaitsecs=3660
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/home/administrator/Documents/fynn_on_live/fynn_on_version_1/storage/logs/demo-worker-quick.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
