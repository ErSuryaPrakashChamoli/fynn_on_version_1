; Supervisor programs for the OCR document queue workers (App\Jobs\ProcessOcrDocument).
;
; Install: sudo cp deploy/supervisor/fynn-ocr-worker.conf /etc/supervisor/conf.d/
; Then:    sudo supervisorctl reread && sudo supervisorctl update
;
; Adjust `directory`, `user`, and the php binary path below to match the
; target server before installing.
;
; Two separate worker pools, not one pool listening to both queues:
; a single multi-page scan can occupy a worker for tens of minutes
; (observed: 180+ pages) across the coordinate-based table pipeline's
; retries. A shared "quick,default" priority queue still leaves a small
; file waiting if every worker happens to already be mid-monster-file when
; it arrives. Reserving fynn-ocr-quick-worker exclusively for "quick"
; guarantees small/simple documents (see
; App\Jobs\ProcessOcrDocument::QUICK_QUEUE_MAX_BYTES) always have a free
; lane regardless of what "default" is grinding through.

[program:fynn-ocr-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/home/administrator/Documents/fynn_on_live/fynn_on_version_1
command=/usr/bin/php8.5 artisan queue:work database --queue=default --sleep=3 --tries=2 --max-time=21600
autostart=true
autorestart=true
startsecs=5
startretries=3
user=administrator
numprocs=2

; Must be >= App\Jobs\ProcessOcrDocument::$timeout (3600s) so Supervisor
; never SIGKILLs a worker mid-way through a large-file OCR job. Laravel's
; queue worker handles the job's own timeout internally (via pcntl) and
; exits cleanly on its own well before this; this is only the outer bound
; for graceful `supervisorctl stop`/restart.
stopwaitsecs=3660
stopsignal=TERM

redirect_stderr=true
stdout_logfile=/home/administrator/Documents/fynn_on_live/fynn_on_version_1/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:fynn-ocr-quick-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/home/administrator/Documents/fynn_on_live/fynn_on_version_1
command=/usr/bin/php8.5 artisan queue:work database --queue=quick --sleep=3 --tries=2 --max-time=21600
autostart=true
autorestart=true
startsecs=5
startretries=3
user=administrator
numprocs=1

stopwaitsecs=3660
stopsignal=TERM

redirect_stderr=true
stdout_logfile=/home/administrator/Documents/fynn_on_live/fynn_on_version_1/storage/logs/worker-quick.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
